<section class="page-hero"><div class="container"><h1>İletişim</h1><p>Soru, öneri ve iş birliği için bize yaz.</p></div></section>
<section class="container" style="padding-bottom:3rem"><div class="narrow" style="max-width:700px"><form class="form-card" id="contactForm" novalidate>

  <div class="form-grid"><div class="field"><label for="cName">Ad Soyad</label><input id="cName" maxlength="80" autocomplete="name"></div><div class="field"><label for="cEmail">E-posta</label><input id="cEmail" type="email" autocomplete="email"></div>
  <div class="field full"><label for="cSubject">Konu</label><input id="cSubject" maxlength="120"></div>
  <div class="field full"><label for="cMsg">Mesajın</label><textarea id="cMsg" maxlength="3000"></textarea></div></div>
  <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn btn-primary btn-block" type="submit">Gönder</button></form></div></section>
