<body data-page="teklif-al">
<main>

<section class="page-hero"><div class="container"><h1>Ücretsiz teklif al</h1><p>İşini kısaca anlat; uygun ustalar seninle iletişime geçsin. Kayıt gerekmez.</p></div></section>
<section class="container" style="padding-bottom:3rem"><div class="narrow" style="max-width:760px">
  <div id="success" class="form-card" hidden style="text-align:center"><div class="icon" style="margin:0 auto 1rem;background:rgba(46,229,157,.14);border-color:rgba(46,229,157,.4);color:var(--ok)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></div><h2>Talebin alındı!</h2><p class="muted" style="margin:.6rem 0 1.4rem">Ekibimiz talebini inceleyip uygun ustalara iletecek. Kısa süre içinde telefonundan sana ulaşılacak.</p><a class="btn btn-primary" href="/ustalar">Ustalara göz at</a></div>
  <form class="form-card" id="quoteForm" novalidate>
    <div id="msg" aria-live="polite"></div>
    <div class="form-grid">
      <div class="field"><label for="qCat">Hizmet kategorisi *</label><select id="qCat" required></select></div>
      <div class="field"><label for="qCity">Şehir *</label><select id="qCity" required></select></div>
      <div class="field"><label for="qDistrict">İlçe</label><input id="qDistrict" maxlength="60" autocomplete="address-level2" placeholder="Örn. Kadıköy"></div>
      <div class="field"><label for="qUrgency">Aciliyet</label><select id="qUrgency"><option value="normal">Bu hafta içinde</option><option value="urgent">Acil (bugün/yarın)</option><option value="flexible">Esnek / planlıyorum</option></select></div>
      <div class="field full"><label for="qDesc">İşin detayı *</label><textarea id="qDesc" maxlength="2000" placeholder="Ne yapılması gerekiyor? Mümkünse m², adet, marka gibi bilgileri yaz."></textarea></div>
      <div class="field"><label for="qBudget">Tahmini bütçe</label><select id="qBudget"><option value="">Belirtmek istemiyorum</option><option>0 – 2.000 ₺</option><option>2.000 – 5.000 ₺</option><option>5.000 – 15.000 ₺</option><option>15.000 – 50.000 ₺</option><option>50.000 ₺ üzeri</option></select></div>
      <div class="field"><label for="qName">Ad Soyad *</label><input id="qName" maxlength="80" autocomplete="name" required></div>
      <div class="field"><label for="qPhone">Cep telefonu *</label><input id="qPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05XX XXX XX XX" required></div>
      <div class="field"><label for="qEmail">E-posta</label><input id="qEmail" type="email" autocomplete="email" placeholder="opsiyonel"></div>
    </div>
    <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label style="display:flex;gap:.6rem;align-items:flex-start;font-weight:400;margin:.4rem 0 1.2rem;color:var(--muted)"><input id="qKvkk" type="checkbox" style="width:auto;margin-top:.25rem"><span><a class="grad-text" href="/kvkk" target="_blank">KVKK aydınlatma metnini</a> okudum; bilgilerimin ustalarla paylaşılmasını kabul ediyorum.</span></label>
    <button class="btn btn-primary btn-block" type="submit">Teklif Talebini Gönder</button>
  </form></div></section>
</main>
<script src="/js/config.js"></script>
<script type="module" src="/js/app.js"></script>
